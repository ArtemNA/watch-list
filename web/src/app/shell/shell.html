<header class="shell__header">
  <a class="shell__logo" routerLink="/">{{ 'app.title' | t }}</a>

  <nav class="shell__nav">
    <a class="shell__nav-link" routerLink="/search" routerLinkActive="shell__nav-link--active">
      {{ 'nav.search' | t }}
    </a>
    <a class="shell__nav-link" routerLink="/settings" routerLinkActive="shell__nav-link--active">
      {{ 'nav.settings' | t }}
    </a>
  </nav>

  <div class="shell__actions">
    @if (!online.isOnline()) {
      <span class="shell__offline" [matTooltip]="'shell.offline.tooltip' | t">
        {{ 'shell.offline.label' | t }}
      </span>
    }

    @if (auth.isLoggedIn()) {
      <button
        type="button"
        class="shell__sync-btn"
        [class.shell__sync-btn--error]="sync.state() === 'error'"
        [disabled]="sync.isSyncing()"
        [matTooltip]="syncTooltip()"
        [attr.aria-label]="syncTooltip()"
        (click)="runSync()"
      >
        @if (sync.isSyncing()) {
          <svg
            class="shell__sync-icon shell__sync-icon--spin"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M21 12a9 9 0 1 1-3-6.7" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
        } @else if (sync.state() === 'error') {
          <svg
            class="shell__sync-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <path d="M12 9v4M12 17h.01" />
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          </svg>
        } @else {
          <svg
            class="shell__sync-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="18"
            height="18"
          >
            <polyline points="20 6 9 17 4 12" />
          </svg>
        }
        @if (sync.pendingConflicts() > 0) {
          <span class="shell__sync-badge">{{ sync.pendingConflicts() }}</span>
        }
      </button>

      <button
        type="button"
        class="shell__account-btn"
        [matMenuTriggerFor]="accountMenu"
        [matTooltip]="auth.email() ?? ''"
        [attr.aria-label]="auth.email() ?? ('nav.account.menuAriaLabel' | t)"
      >
        {{ auth.email() }}
      </button>
      <mat-menu #accountMenu="matMenu">
        <button mat-menu-item type="button" [disabled]="sync.isSyncing()" (click)="runSync()">
          {{ (sync.isSyncing() ? 'nav.account.syncing' : 'nav.account.sync') | t }}
        </button>
        <button mat-menu-item type="button" (click)="logout()">{{ 'nav.account.logout' | t }}</button>
      </mat-menu>
    } @else {
      <a
        class="shell__login-link"
        routerLink="/auth"
        [matTooltip]="'nav.login.tooltip' | t"
      >
        {{ 'nav.login' | t }}
      </a>
    }

    <div class="shell__lang" role="group" [attr.aria-label]="'shell.lang.label' | t">
      <button
        type="button"
        class="shell__lang-btn"
        [class.shell__lang-btn--active]="i18n.lang() === 'uk'"
        [attr.aria-pressed]="i18n.lang() === 'uk'"
        (click)="setLang('uk')"
      >
        UK
      </button>
      <button
        type="button"
        class="shell__lang-btn"
        [class.shell__lang-btn--active]="i18n.lang() === 'en'"
        [attr.aria-pressed]="i18n.lang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <button
      type="button"
      class="shell__theme-toggle"
      [attr.aria-label]="(theme.theme() === 'dark' ? 'shell.theme.toggleToLight' : 'shell.theme.toggleToDark') | t"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="20"
          height="20"
        >
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="20"
          height="20"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </div>
</header>

<main class="shell__content">
  <router-outlet />
</main>
