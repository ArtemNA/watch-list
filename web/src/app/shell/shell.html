<header class="shell__header">
  <span class="shell__logo">{{ 'app.title' | t }}</span>

  <div class="shell__actions">
    <div class="shell__lang" role="group" [attr.aria-label]="'shell.lang.label' | t">
      <button
        type="button"
        class="shell__lang-btn"
        [class.shell__lang-btn--active]="i18n.lang() === 'uk'"
        [attr.aria-pressed]="i18n.lang() === 'uk'"
        (click)="setLang('uk')"
      >
        UK
      </button>
      <button
        type="button"
        class="shell__lang-btn"
        [class.shell__lang-btn--active]="i18n.lang() === 'en'"
        [attr.aria-pressed]="i18n.lang() === 'en'"
        (click)="setLang('en')"
      >
        EN
      </button>
    </div>

    <button
      type="button"
      class="shell__theme-toggle"
      [attr.aria-label]="(theme.theme() === 'dark' ? 'shell.theme.toggleToLight' : 'shell.theme.toggleToDark') | t"
      (click)="theme.toggle()"
    >
      @if (theme.theme() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="20"
          height="20"
        >
          <circle cx="12" cy="12" r="4" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          width="20"
          height="20"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </div>
</header>

<main class="shell__content">
  <router-outlet />
</main>
