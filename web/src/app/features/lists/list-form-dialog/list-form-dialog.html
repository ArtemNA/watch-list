<h2 mat-dialog-title>{{ (isEdit ? 'lists.form.editTitle' : 'lists.form.createTitle') | t }}</h2>
<form (submit)="submit($event)">
  <mat-dialog-content class="list-form-dialog__content">
    <app-input
      [label]="'lists.form.name' | t"
      [placeholder]="'lists.form.namePlaceholder' | t"
      [(value)]="name"
      [errorText]="nameError()"
    />
    <app-input
      [label]="'lists.form.description' | t"
      [placeholder]="'lists.form.descriptionPlaceholder' | t"
      [multiline]="true"
      [(value)]="description"
    />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <app-button type="button" variant="ghost" (click)="close()">{{ 'common.cancel' | t }}</app-button>
    <app-button type="submit">{{ (isEdit ? 'common.save' : 'lists.form.create') | t }}</app-button>
  </mat-dialog-actions>
</form>
